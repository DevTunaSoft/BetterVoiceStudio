name: Handoff validation
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Validate engineering handoff
        run: python3 scripts/validate_handoff.py
      - name: Test validator rejects incomplete handoffs
        run: python3 -m unittest discover -s tests -p 'test_handoff_validator.py'
